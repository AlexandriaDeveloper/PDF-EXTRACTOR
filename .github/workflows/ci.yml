name: Test Python parser and build Windows app
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Python on \${{ matrix.os }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q payroll_core.py payroll_export.py oracle_payroll_extractor.py
      - run: python -m unittest discover -s tests -v
  windows-exe:
    name: Windows EXE
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm --clean OraclePayrollExtractor.spec
      - run: |
          if (!(Test-Path "dist/OraclePayrollExtractor.exe")) { throw "Missing generated EXE" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: OraclePayrollExtractor-windows-x64
          path: dist/OraclePayrollExtractor.exe
          retention-days: 14
          if-no-files-found: error
